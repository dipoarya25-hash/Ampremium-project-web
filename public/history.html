<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Riwayat — Alight Motion Premium</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" /></head>
<body><main class="wrap"><header class="page-head"><p class="product-eyebrow">Aktivitas akun</p><h1 class="product-title">Riwayat Payment</h1><p class="product-sub">Aktivasi yang berhasil dari perangkat ini.</p><button class="small-btn" id="sync-history" type="button">Sinkronkan ke admin</button><p class="history-meta" id="sync-status" aria-live="polite"></p></header><section class="history-list" id="history-list" aria-live="polite"></section></main><script src="client.js"></script><script>
const target=document.getElementById('history-list'),history=getHistory(),syncButton=document.getElementById('sync-history'),syncStatus=document.getElementById('sync-status');if(!history.length){target.innerHTML='<div class="empty-state">Belum ada riwayat aktivasi.<br>Setelah aktivasi berhasil, detailnya akan muncul di sini.</div>'}else{target.innerHTML=history.map(function(item){const date=new Date(item.createdAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});return '<article class="history-card"><div class="history-top"><div class="history-email">'+item.email+'</div><span class="status-pill">'+item.status+'</span></div><div class="history-meta">Order '+item.orderId+' · '+item.duration+'</div><div class="history-meta">'+date+'</div></article>'}).join('')};async function sync(){syncButton.disabled=true;syncStatus.textContent='Menyinkronkan…';try{const data=await syncHistoryToAccount();syncStatus.textContent=(data.count||0)+' riwayat berhasil tersinkron ke admin.'}catch(error){syncStatus.textContent='Gagal sinkron: '+error.message}finally{syncButton.disabled=false}}syncButton.addEventListener('click',sync);sync()
</script></body></html>
