<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Amprem</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#eef0f4;font-family:Inter,sans-serif}.box{width:min(390px,calc(100% - 40px));padding:30px;background:#131722;border:1px solid #1f2530;border-radius:18px}h1{margin:0 0 7px;font-size:24px}p{color:#9aa3b2;font-size:14px;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px}input,button{box-sizing:border-box;width:100%;border-radius:10px;padding:13px;font:inherit}input{background:#0d1017;border:1px solid #1f2530;color:#eef0f4}button{margin-top:22px;border:0;background:#22c55e;color:#06170d;font-weight:700;cursor:pointer}.notice{min-height:20px;color:#fca5a5;font-size:13px;margin-top:14px}</style></head><body><main class="box"><h1>Masuk ke Amprem</h1><p>Gunakan username dan password yang dibuatkan admin.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Masuk</button><div class="notice" id="notice" role="alert"></div></form></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),n=document.getElementById('notice');b.disabled=true;n.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.message);location.href='/'}catch(x){n.textContent=x.message}finally{b.disabled=false}})</script></body></html>
