<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Inbox Mail — Alight Motion Premium</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" /></head>
<body><main class="wrap"><header class="page-head"><p class="product-eyebrow">Email sementara</p><h1 class="product-title">Inbox Mail</h1><p class="product-sub">Buat alamat dan pantau email masuk secara langsung.</p></header><section class="step-card accent-b"><div class="step-head"><div class="step-badge b">✉</div><div class="step-title">Alamat sementara</div></div><p class="step-desc">Alamat dan akses mailbox tersimpan di browser perangkat ini.</p><div class="mail-address"><code id="mail-address">Belum dibuat</code><button class="small-btn" id="copy-address">Salin</button></div><div class="inbox-actions"><button class="action-btn b" id="new-address">Buat alamat baru</button><button class="action-btn ghost" id="refresh-inbox">↻ Refresh</button></div><p class="mail-note" id="inbox-note">Buat alamat baru untuk mulai menerima email.</p></section><section><p class="perks-title">📨 Pesan masuk</p><div class="mail-list" id="mail-list"></div></section></main><script src="client.js"></script><script>
const addressEl=document.getElementById('mail-address'),listEl=document.getElementById('mail-list'),noteEl=document.getElementById('inbox-note'),newBtn=document.getElementById('new-address'),refreshBtn=document.getElementById('refresh-inbox');let address=localStorage.getItem('amprem-temp-address')||'',accessToken=localStorage.getItem('amprem-temp-token')||'';
function hiddenMailTokens(){try{return JSON.parse(localStorage.getItem('amprem-hidden-mails')||'[]')}catch{return []}}
function hideMail(token){const tokens=hiddenMailTokens();if(!tokens.includes(token)){tokens.push(token);localStorage.setItem('amprem-hidden-mails',JSON.stringify(tokens))}}
function esc(value){const el=document.createElement('div');el.textContent=String(value);return el.innerHTML}
function render(mails){addressEl.textContent=address||'Belum dibuat';const hidden=hiddenMailTokens(),visible=mails.filter(function(mail){return !hidden.includes(mail.token)});listEl.innerHTML=visible.length?visible.map(function(mail,index){const subject=typeof mail==='object'?mail.subject:mail;const from=typeof mail==='object'?mail.from:'';const text=typeof mail==='object'?mail.text:'';const html=typeof mail==='object'?mail.html:'';const links=typeof mail==='object'&&Array.isArray(mail.links)?mail.links:[];const linkButtons=links.length?'<div class="mail-links">'+links.map(function(link){return '<a class="mail-app-link" href="'+esc(link)+'" target="_blank" rel="noopener">↗ Buka link</a>'}).join('')+'</div>':'';return '<article class="mail-card" data-token="'+esc(mail.token||'')+'"><div class="mail-card-top"><button class="mail-open-btn" type="button" data-mail="'+index+'"><span><span class="mail-subject">'+esc(subject)+'</span>'+(from?'<span class="mail-time">Dari: '+esc(from)+'</span>':'')+'</span><span class="mail-chevron" aria-hidden="true">⌄</span></button><button class="mail-delete-btn" type="button" aria-label="Hapus email" title="Hapus dari inbox ini">⌫</button></div><div class="mail-content" id="mail-'+index+'">'+(html?'<div class="mail-html" id="mail-html-'+index+'"></div>':text?'<div class="mail-preview">'+esc(text)+'</div>':'<div class="mail-preview">Isi email tidak tersedia dari provider.</div>')+linkButtons+'</div></article>'}).join(''):'<div class="empty-state">Belum ada email masuk.</div>';visible.forEach(function(mail,index){if(!mail.html)return;const host=document.getElementById('mail-html-'+index),frame=document.createElement('iframe');frame.className='mail-frame';frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');frame.srcdoc='<base target="_blank">'+mail.html;host.appendChild(frame)})}
async function refresh(){if(!accessToken){render([]);return}refreshBtn.disabled=true;refreshBtn.textContent='Memuat...';try{const data=await apiCall('/api/inbox/preview',{accessToken});noteEl.textContent=data.expired?'Mailbox sudah kedaluwarsa. Buat alamat baru.':'Inbox diperbarui. Tekan Refresh untuk mengecek email baru.';render(data.mails)}catch(err){noteEl.textContent=err.message;render([])}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ Refresh'}}
newBtn.addEventListener('click',async function(){newBtn.disabled=true;newBtn.textContent='Membuat...';try{const data=await apiCall('/api/inbox/new');address=data.email;accessToken=data.accessToken;localStorage.setItem('amprem-temp-address',address);localStorage.setItem('amprem-temp-token',accessToken);noteEl.textContent='Alamat baru siap. Gunakan alamat ini lalu tekan Refresh untuk melihat email masuk.';await refresh()}catch(err){noteEl.textContent=err.message}finally{newBtn.disabled=false;newBtn.textContent='Buat alamat baru'}});listEl.addEventListener('click',function(event){const deleteBtn=event.target.closest('.mail-delete-btn');if(deleteBtn){const card=deleteBtn.closest('.mail-card');hideMail(card.dataset.token);card.remove();if(!listEl.children.length)listEl.innerHTML='<div class="empty-state">Belum ada email masuk.</div>';return}const button=event.target.closest('.mail-open-btn');if(!button)return;const card=button.closest('.mail-card');const isOpen=card.classList.toggle('open');button.setAttribute('aria-expanded',String(isOpen))});document.getElementById('copy-address').addEventListener('click',function(){if(!address)return;navigator.clipboard.writeText(address).then(function(){this.textContent='Tersalin!';setTimeout(function(){this.textContent='Salin'}.bind(this),1500)}.bind(this))});refreshBtn.addEventListener('click',refresh);render([]);if(accessToken)refresh()
function addCopyLinkButtons(){listEl.querySelectorAll('.mail-app-link').forEach(function(link){if(link.dataset.copyReady)return;link.dataset.copyReady='1';const button=document.createElement('button');button.type='button';button.className='mail-app-link copy-mail-link';button.dataset.link=link.href;button.textContent='Salin link';button.addEventListener('click',function(){navigator.clipboard.writeText(button.dataset.link).then(function(){button.textContent='Tersalin!';setTimeout(function(){button.textContent='Salin link'},1500)}).catch(function(){button.textContent='Gagal menyalin'})});link.insertAdjacentElement('afterend',button)})}new MutationObserver(addCopyLinkButtons).observe(listEl,{childList:true,subtree:true});addCopyLinkButtons()
</script></body></html>
